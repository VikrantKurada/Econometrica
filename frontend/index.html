<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Econometrica</title>
    <script>
      // Resolve the theme before first paint so a dark-mode reload never
      // flashes a white screen. Mirrors resolveTheme() in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("econometrica.theme");
          var pref = stored === "light" || stored === "dark" ? stored : null;
          var dark = pref
            ? pref === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (err) {
          /* private mode, no storage: fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
