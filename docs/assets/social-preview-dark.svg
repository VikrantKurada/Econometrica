<text x="640.0" y="448" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">agent roles</text>
<rect x="767.5999999999999" y="360" width="219.2" height="108" rx="12" fill="#171c24" stroke="#272e39"/>
<text x="877.1999999999999" y="418" fill="#c98500" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" text-anchor="middle" letter-spacing="0">14</text>
<text x="877.1999999999999" y="448" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">chart types</text>
<rect x="1004.8" y="360" width="219.2" height="108" rx="12" fill="#171c24" stroke="#272e39"/>
<text x="1114.3999999999999" y="418" fill="#d55181" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="1114.3999999999999" y="448" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">LLM providers</text>
<text x="56" y="528" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Every number traces to a tested function with a reproducibility manifest.</text>
<text x="56" y="566" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Tools refuse work the data cannot support</text>
<text x="1224" y="566" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" letter-spacing="0">Python · FastAPI · React · TimescaleDB · pgvector</text>
