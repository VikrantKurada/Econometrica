<text x="402.79999999999995" y="448" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">tool families</text>
<rect x="530.4" y="360" width="219.2" height="108" rx="12" fill="#171c24" stroke="#272e39"/>
