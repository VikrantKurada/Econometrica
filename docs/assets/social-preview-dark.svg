<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Econometrica — a local econometrics workbench">
<title>Econometrica</title>
<rect x="0" y="0" width="1280" height="640" rx="0" fill="#0f1319" stroke="none"/>
<text x="56" y="130" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="82" font-weight="700" text-anchor="start" letter-spacing="0">Econometrica</text>
<text x="56" y="176" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0">A local econometrics workbench for asset pricing and market efficiency</text>
<rect x="56" y="218" width="1168" height="104" rx="12" fill="#171c24" stroke="#272e39"/>
<rect x="56" y="218" width="5" height="104" rx="2.5" fill="#008300" stroke="none"/>
<text x="84" y="262" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" letter-spacing="0">LLMs never compute statistics.</text>
<text x="84" y="298" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">They select from a registry of typed, versioned tools — the tools compute.</text>
