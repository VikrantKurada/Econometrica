<title>Econometrica</title>
<rect x="0" y="0" width="1280" height="640" rx="0" fill="#ffffff" stroke="none"/>
<text x="56" y="130" fill="#14181d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="82" font-weight="700" text-anchor="start" letter-spacing="0">Econometrica</text>
<text x="56" y="176" fill="#5b6675" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0">A local econometrics workbench for asset pricing and market efficiency</text>
<rect x="56" y="218" width="1168" height="104" rx="12" fill="#fafafa" stroke="#e3e7ec"/>
<rect x="56" y="218" width="5" height="104" rx="2.5" fill="#008300" stroke="none"/>
<text x="84" y="262" fill="#14181d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" text-anchor="start" letter-spacing="0">LLMs never compute statistics.</text>
<text x="84" y="298" fill="#5b6675" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">They select from a registry of typed, versioned tools — the tools compute.</text>
