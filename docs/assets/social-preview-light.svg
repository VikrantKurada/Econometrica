<text x="1114.3999999999999" y="418" fill="#e87ba4" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="1114.3999999999999" y="448" fill="#5b6675" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">LLM providers</text>
<text x="56" y="528" fill="#14181d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Every number traces to a tested function with a reproducibility manifest.</text>
<text x="56" y="566" fill="#8d97a5" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Tools refuse work the data cannot support</text>
