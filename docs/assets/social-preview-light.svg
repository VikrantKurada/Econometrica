<text x="402.79999999999995" y="448" fill="#5b6675" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">tool families</text>
