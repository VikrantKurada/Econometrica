<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Five rungs of capability, each one made reachable by the one below it">
<title>The art of the possible</title>
<rect x="0" y="0" width="1280" height="600" rx="0" fill="#0f1319" stroke="none"/>
<text x="44" y="54" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">The art of the possible</text>
<text x="44" y="80" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Each rung is only reachable because the one under it is mechanical rather than a promise.</text>
<rect x="228" y="128" width="1008" height="72" rx="8" fill="#171c24" stroke="#272e39"/>
<rect x="228" y="128" width="3" height="72" rx="1.5" fill="#d95926" stroke="none"/>
<text x="246" y="155" fill="#d95926" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">5</text>
<text x="268" y="155" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0">A market for method</text>
<text x="268" y="175" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">Tools published, versioned and cited by people who did not write this application.</text>
<text x="1218" y="175" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="0">Because a tool is a typed function with a version, not a paragraph in a notebook.</text>
<path d="M206 214 L206 204 L240 204" fill="none" stroke="#6f7c8d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<rect x="182" y="214" width="1054" height="72" rx="8" fill="#171c24" stroke="#272e39"/>
<rect x="182" y="214" width="3" height="72" rx="1.5" fill="#c98500" stroke="none"/>
<text x="200" y="241" fill="#c98500" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">4</text>
<text x="222" y="241" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0">Analysis that watches itself</text>
<text x="222" y="261" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">Efficiency scores and betas recomputed on a schedule, with alerts when they move.</text>
<text x="1218" y="261" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="0">Because a run is already re-runnable without a model in the loop.</text>
<path d="M160 300 L160 290 L194 290" fill="none" stroke="#6f7c8d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<rect x="136" y="300" width="1100" height="72" rx="8" fill="#171c24" stroke="#272e39"/>
<rect x="136" y="300" width="3" height="72" rx="1.5" fill="#9085e9" stroke="none"/>
<text x="154" y="327" fill="#9085e9" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">3</text>
<text x="176" y="327" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0">A desk with a memory</text>
<text x="176" y="347" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">Every question the team ever asked, with the evidence, searchable.</text>
<text x="1218" y="347" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="0">Because a run is a row, not a conversation, and its artifacts are structured.</text>
<path d="M114 386 L114 376 L148 376" fill="none" stroke="#6f7c8d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<rect x="90" y="386" width="1146" height="72" rx="8" fill="#171c24" stroke="#272e39"/>
<rect x="90" y="386" width="3" height="72" rx="1.5" fill="#3987e5" stroke="none"/>
<text x="108" y="413" fill="#3987e5" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">2</text>
<text x="130" y="413" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0">A study that survives its author</text>
<text x="130" y="433" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">Anyone can re-run it a year later and be told, per step, what moved.</text>
<text x="1218" y="433" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="0">Because the manifest names the data fingerprint, the tool version and the source.</text>
<path d="M68 472 L68 462 L102 462" fill="none" stroke="#6f7c8d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<rect x="44" y="472" width="1192" height="72" rx="8" fill="#171c24" stroke="#272e39"/>
<rect x="44" y="472" width="3" height="72" rx="1.5" fill="#199e70" stroke="none"/>
<text x="62" y="499" fill="#199e70" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">1</text>
<text x="84" y="499" fill="#e8ecf1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0">A number you can check</text>
<text x="84" y="519" fill="#93a0b1" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">A single result with a manifest under it.</text>
<text x="1218" y="519" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="0">This is the rung everything else stands on, and it is the one that is built.</text>
<line x1="44" y1="554" x2="1236" y2="554" stroke="#272e39" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="574" fill="#6f7c8d" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0">The interesting thing about this ladder is that the hard rung is the first one. Everything above it is engineering; the first one is a design decision nobody can retrofit.</text>
</svg>
